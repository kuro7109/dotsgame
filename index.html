<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Classic Snake game with minimal design. Play offline anytime.">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Snake">

    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">

    <!-- iOS Icons -->
    <link rel="apple-touch-icon" href="./icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./style.css">

    <title>Snake — Classic Game</title>
</head>
<body>
    <div class="game-wrapper">
        <!-- Header -->
        <div class="header">
            <div class="logo">Snake</div>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-label">Score</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Best</span>
                    <span class="stat-value" id="highScore">0</span>
                </div>
            </div>
        </div>

        <!-- Main Game Area -->
        <div class="game-container">
            <!-- Left Side Controls -->
            <div class="side-controls-left">
                <button class="btn" id="startBtn">Start</button>
                <button class="btn hidden" id="pauseBtn">Pause</button>
            </div>

            <!-- Game Canvas -->
            <div class="game-canvas-wrapper">
                <canvas id="gameCanvas"></canvas>

                <!-- Start Overlay -->
                <div class="game-overlay active" id="startOverlay">
                    <div class="overlay-title">Ready to play?</div>
                    <div class="overlay-subtitle">Press Start or Space to begin</div>
                    <div class="keyboard-hints">
                        <div class="key-hint">↑</div>
                        <div class="key-hint">↓</div>
                        <div class="key-hint">←</div>
                        <div class="key-hint">→</div>
                    </div>
                </div>

                <!-- Pause Overlay -->
                <div class="game-overlay" id="pauseOverlay">
                    <div class="overlay-title">Paused</div>
                    <div class="overlay-subtitle">Press Resume or Space to continue</div>
                </div>

                <!-- Game Over Overlay -->
                <div class="game-overlay" id="gameOverOverlay">
                    <div class="overlay-title">Game Over</div>
                    <div class="game-over-stats">
                        <p>Your score <strong id="finalScore">0</strong></p>
                        <p>Best score <strong id="finalHighScore">0</strong></p>
                    </div>
                    <div class="overlay-subtitle">Press Start or Space to play again</div>
                </div>
            </div>

            <!-- Right Side Controls -->
            <div class="side-controls-right">
                <div class="difficulty-selector">
                    <span class="difficulty-label">Speed</span>
                    <button class="difficulty-option" data-speed="150">Slow</button>
                    <button class="difficulty-option active" data-speed="100">Normal</button>
                    <button class="difficulty-option" data-speed="60">Fast</button>
                    <button class="difficulty-option" data-speed="35">Extreme</button>
                </div>
            </div>
        </div>

        <!-- Bottom Info -->
        <div class="controls">
            <div class="keyboard-hints">
                <div class="key-hint">↑</div>
                <div class="key-hint">↓</div>
                <div class="key-hint">←</div>
                <div class="key-hint">→</div>
                <div class="key-hint">Space</div>
                <div class="key-hint">Esc</div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="./script.js"></script>
</body>
</html>
